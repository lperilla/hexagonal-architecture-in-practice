<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquitectura hexagonal con Java y Spring Boot: Petstore</title>
<style>
:root{
  color-scheme: light;
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9EDEA; --ink:#1B2A31; --muted:#56676E; --line:#D3DBD6;
  --domain:#2E6B4E; --domain-soft:#E0EDE5;
  --app:#3B5BA5;    --app-soft:#E3E9F6;
  --adapter:#9A6410; --adapter-soft:#F4E9D3;
  --risk:#A8323F;   --risk-soft:#F6E2E4;
  --code-bg:#1D2A30; --code-ink:#E2E9EC; --code-muted:#7D9098; --code-hl:#2B3D45;
  --tk-kw:#F0A86B; --tk-str:#A8D49A; --tk-ann:#E7C46B; --tk-type:#8FC1F0; --tk-com:#7D9098; --tk-num:#D9A0E0;
  --focus:#3B5BA5;
  --serif:"Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#131A1D; --surface:#1A2428; --surface-2:#212D32; --ink:#E3EAEC; --muted:#9AAAB1; --line:#2E3C42;
    --domain:#74C49A; --domain-soft:#1E3328;
    --app:#93ABEA;    --app-soft:#212C44;
    --adapter:#E2AB4C; --adapter-soft:#372C17;
    --risk:#E8828E;   --risk-soft:#3A2226;
    --code-bg:#0E1518; --code-hl:#1F2E34;
    --focus:#93ABEA;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.5;
  display:grid; grid-template-rows:auto 1fr auto; min-height:100vh;
}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:not-allowed; opacity:.45}

/* ---------- Cabecera ---------- */
.top{
  position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
  display:grid; grid-template-columns:auto 1fr auto; gap:24px; align-items:center; padding:10px 22px;
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--serif); font-size:1.05rem; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand small{display:block; color:var(--muted); font-size:.8rem}
.progress{display:flex; align-items:center; gap:12px; min-width:0}
.bar{flex:1; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--domain); width:0; transition:width .25s ease}
.progress span{font-size:.82rem; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.tools{display:flex; gap:8px; align-items:center}
.tool{
  border:1px solid var(--line); background:transparent; border-radius:6px; padding:6px 12px; font-size:.85rem;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.tool:hover{background:var(--surface-2)}
.tool.late{border-color:var(--risk); color:var(--risk)}

/* ---------- Estructura ---------- */
.frame{display:grid; grid-template-columns:290px 1fr; min-height:0}
.nav{border-right:1px solid var(--line); background:var(--surface); padding:18px 12px; overflow-y:auto}
.nav ol{list-style:none; margin:0; padding:0}
.nav li button{
  width:100%; text-align:left; display:grid; grid-template-columns:26px 1fr; gap:10px; align-items:start;
  background:transparent; border:0; border-radius:8px; padding:9px 10px; line-height:1.3;
}
.nav li button:hover{background:var(--surface-2)}
.nav .dot{
  width:22px; height:22px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center;
  font-size:.72rem; font-weight:600; color:var(--muted); margin-top:1px;
}
.nav .t{font-size:.92rem; display:block}
.nav .m{display:block; font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:2px}
.nav [data-state="current"]{background:var(--app-soft)}
.nav [data-state="current"] .dot{border-color:var(--app); color:var(--app)}
.nav [data-state="current"] .t{font-weight:600}
.nav [data-state="done"] .dot{background:var(--domain); border-color:var(--domain); color:var(--surface)}
.nav [data-state="done"] .t{color:var(--muted)}
.nav .legend{margin:18px 10px 0; font-size:.75rem; color:var(--muted); line-height:1.6}

.stage{overflow-y:auto; padding:34px 48px 60px}
.screen{max-width:1120px; margin:0 auto}
.screen.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .screen.enter{animation:none} .bar i{transition:none} }

.modhead{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:.9rem; margin-bottom:4px}
.modhead b{color:var(--ink); font-weight:600}
h2{font-family:var(--serif); font-weight:600; font-size:2.2rem; line-height:1.15; margin:0 0 6px; letter-spacing:-.01em}
.goal{color:var(--muted); margin:0 0 26px; max-width:70ch}
h3{font-family:var(--serif); font-weight:600; font-size:1.3rem; margin:28px 0 10px}
p{max-width:72ch}
.lead{font-size:1.12rem}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; align-items:start}
.split{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:28px; align-items:start}
code.i{font-family:var(--mono); font-size:.88em; background:var(--surface-2); padding:1px 5px; border-radius:4px}

/* ---------- Componentes ---------- */
.concept{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--c); border-radius:4px 10px 10px 4px; padding:16px 18px}
.concept h4{margin:0 0 4px; font-family:var(--serif); font-size:1.15rem; color:var(--c)}
.concept p{margin:0 0 8px}
.concept .ex{font-size:.88rem; color:var(--muted)}
.c-domain{--c:var(--domain)} .c-app{--c:var(--app)} .c-adapter{--c:var(--adapter)}

.code{background:var(--code-bg); color:var(--code-ink); border-radius:10px; overflow:hidden; font-size:.86rem; margin:0 0 18px}
.code header{display:flex; justify-content:space-between; gap:12px; padding:8px 14px; font-family:var(--mono); font-size:.78rem; color:var(--code-muted); border-bottom:1px solid #ffffff14}
.code pre{margin:0; padding:10px 0; overflow-x:auto; font-family:var(--mono); line-height:1.55}
.code .ln{display:block; padding:0 16px 0 0; border-left:3px solid transparent}
.code .ln.hl{background:var(--code-hl); border-left-color:var(--tk-ann)}
.code .n{display:inline-block; width:3.2em; text-align:right; padding-right:1.1em; color:var(--code-muted); user-select:none}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-ann{color:var(--tk-ann)} .tk-type{color:var(--tk-type)} .tk-com{color:var(--tk-com); font-style:italic} .tk-num{color:var(--tk-num)}

.ba{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px}
.ba .tag{font-size:.85rem; font-weight:600; margin:0 0 6px}
.ba .before .tag{color:var(--risk)} .ba .after .tag{color:var(--domain)}

.decision{border:1px solid var(--app); border-radius:12px; background:var(--app-soft); padding:4px 0; margin:0 0 18px}
.decision div{display:grid; grid-template-columns:130px 1fr; gap:14px; padding:10px 18px}
.decision div + div{border-top:1px solid var(--line)}
.decision dt{font-weight:600; color:var(--app); margin:0}
.decision dd{margin:0}

.check{border:2px dashed var(--app); border-radius:14px; padding:22px 26px; margin:8px 0 18px; background:var(--surface)}
.check .q{font-family:var(--serif); font-size:1.55rem; line-height:1.3; margin:0 0 12px; max-width:40ch}
.check .hint{color:var(--muted); margin:0}
.check .a{display:none; margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
.check.revealed{border-style:solid}
.check.revealed .a{display:block}
.check.revealed .hint{display:none}
.check .a strong{color:var(--domain)}

.mistake{display:grid; grid-template-columns:44px 1fr; gap:14px; padding:14px 0; border-top:1px solid var(--line)}
.mistake:first-child{border-top:0}
.mistake .num{width:36px; height:36px; border-radius:50%; background:var(--risk-soft); color:var(--risk); display:grid; place-items:center; font-weight:700}
.mistake h4{margin:2px 0 4px; font-size:1.05rem}
.mistake p{margin:0; font-size:.95rem}
.mistake .fix{color:var(--domain)}
.mistake .fix b, .mistake .eff b{font-weight:600}

.keys{list-style:none; padding:0; margin:0 0 18px}
.keys li{padding:8px 0 8px 22px; position:relative; border-bottom:1px solid var(--line); max-width:72ch}
.keys li::before{content:""; position:absolute; left:2px; top:17px; width:9px; height:9px; background:var(--domain); transform:rotate(45deg)}
.steps{padding-left:1.3em; margin:0 0 18px} .steps li{padding:3px 0}

.rule{font-family:var(--serif); font-size:1.5rem; line-height:1.35; border-left:4px solid var(--domain); padding:4px 0 4px 20px; margin:12px 0 22px; max-width:46ch}

.figure{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 0 18px}
.figure svg{width:100%; height:auto; display:block}
.figure figcaption{font-size:.85rem; color:var(--muted); padding:6px 6px 0}

.pyramid{display:flex; flex-direction:column; align-items:center; gap:6px; margin:6px 0 20px}
.pyramid div{padding:12px 16px; border-radius:6px; text-align:center; font-size:.95rem}
.pyramid small{display:block; color:var(--muted); font-size:.8rem}

.hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:36px; align-items:center; margin-top:10px}
.hero h2{font-size:2.7rem; line-height:1.07; letter-spacing:-.02em}
.hero .sub{font-size:1.25rem; color:var(--muted); margin:14px 0 0}
.big-q{font-family:var(--serif); font-size:2.6rem; line-height:1.2; max-width:24ch; margin:40px 0 20px; letter-spacing:-.01em}

.scope h4{margin:0 0 6px; font-size:1rem}
.scope ul{margin:0; padding-left:1.1em}
.scope .out h4{color:var(--muted)}


.tblwrap{overflow-x:auto; margin:0 0 18px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.tbl{width:100%; border-collapse:collapse; font-size:.93rem}
.tbl th,.tbl td{padding:9px 14px; text-align:left; vertical-align:top; border-top:1px solid var(--line)}
.tbl thead th{background:var(--surface-2); border-top:0; font-weight:600}
.tbl td:first-child{font-weight:600}
/* ---------- Pie ---------- */
.foot{border-top:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 22px}
.foot .grp{display:flex; gap:10px; align-items:center}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 18px; font-weight:600}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--app); border-color:var(--app); color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08); background:var(--app)}
@media (prefers-color-scheme: dark){ .btn.primary{color:#0E1518} }
.kbd{font-size:.78rem; color:var(--muted)}

.notes{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:2px solid var(--adapter); padding:16px 26px 22px; max-height:40vh; overflow-y:auto; box-shadow:0 -8px 24px #0002; display:none}
.notes.open{display:block}
.notes h4{margin:0 0 6px; color:var(--adapter)}
.notes p{margin:0 0 6px}
.cut{display:inline-block; background:var(--adapter-soft); color:var(--adapter); border-radius:4px; padding:1px 8px; font-size:.82rem; font-weight:600}

/* ---------- Modo presentación ---------- */
body.presenting .frame{grid-template-columns:1fr}
body.presenting .nav{display:none}
body.presenting{font-size:19px}
body.presenting .stage{padding:40px 64px 60px}

/* ---------- Responsive ---------- */
@media (max-width: 1000px){
  .frame{grid-template-columns:1fr}
  .nav{border-right:0; border-bottom:1px solid var(--line); padding:8px}
  .nav ol{display:flex; overflow-x:auto; gap:4px}
  .nav li button{grid-template-columns:24px auto; white-space:nowrap}
  .nav .m, .nav .legend{display:none}
  .grid2,.grid3,.split,.ba,.hero{grid-template-columns:1fr}
  .stage{padding:22px 18px 50px}
  .hero h2{font-size:2.2rem}
  h2{font-size:1.7rem}
  .big-q{font-size:1.8rem}
  .top{grid-template-columns:1fr auto; gap:10px}
  .progress{grid-column:1/-1; grid-row:2}
  .kbd{display:none}
}
@media (max-width: 560px){
  .brand small,.tool.opt{display:none}
  .decision div{grid-template-columns:1fr; gap:2px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><polygon points="28,15 21.5,26.3 8.5,26.3 2,15 8.5,3.7 21.5,3.7" fill="none" stroke="var(--app)" stroke-width="2"/><polygon points="20,15 17.5,19.3 12.5,19.3 10,15 12.5,10.7 17.5,10.7" fill="var(--domain)"/></svg>
    <div><h1>Arquitectura hexagonal con Java y Spring Boot</h1><small>4 de diciembre de 2026, 50 minutos y 10 de preguntas</small></div>
  </div>
  <div class="progress" aria-live="polite">
    <div class="bar" role="progressbar" aria-label="Progreso del recorrido" aria-valuemin="0" aria-valuemax="100" id="bar"><i></i></div>
    <span id="progressText"></span>
  </div>
  <div class="tools">
    <button class="tool" id="timer" title="Cronómetro de ensayo (T)">Iniciar cronómetro</button>
    <button class="tool opt" id="notesBtn" title="Notas del ponente (N)">Notas</button>
    <button class="tool" id="presentBtn" title="Modo presentación (P)">Presentar</button>
  </div>
</header>

<div class="frame">
  <nav class="nav" aria-label="Módulos de la charla">
    <ol id="navList"></ol>
    <p class="legend">Flechas o mando: avanzar y retroceder<br>S: ver solución<br>N: notas<br>P: presentar<br>T: cronómetro</p>
  </nav>
  <main class="stage" id="stage"><div class="screen" id="screen"></div></main>
</div>

<footer class="foot">
  <div class="grp"><button class="btn" id="prev">Anterior</button><span class="kbd" id="screenPos"></span></div>
  <div class="grp"><button class="btn" id="reveal">Ver solución</button><button class="btn primary" id="next">Continuar</button></div>
</footer>

<aside class="notes" id="notes" aria-label="Notas del ponente"></aside>

<script>
/* =========================================================
   Utilidades y componentes
   ========================================================= */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const JAVA_RE = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(@[A-Za-z]+)|\b(public|private|protected|final|class|interface|record|static|return|new|if|else|throw|throws|void|int|boolean|implements|extends|import|package|this|null|true|false|var|for|try|catch)\b|\b([A-Z][A-Za-z0-9_]*)\b|\b(\d+)\b/g;
function hlLine(line, lang){
  if (lang === 'java'){
    let out = '', last = 0;
    line.replace(JAVA_RE, (m, com, str, ann, kw, type, num, off) => {
      out += esc(line.slice(last, off));
      const cls = com ? 'com' : str ? 'str' : ann ? 'ann' : kw ? 'kw' : type ? 'type' : 'num';
      out += `<span class="tk-${cls}">${esc(m)}</span>`;
      last = off + m.length; return m;
    });
    return out + esc(line.slice(last));
  }
  if (lang === 'bash'){
    const i = line.indexOf('#');
    return i >= 0 ? esc(line.slice(0,i)) + `<span class="tk-com">${esc(line.slice(i))}</span>` : esc(line);
  }
  return esc(line);
}

/** CodePanel: archivo, lenguaje y líneas resaltadas */
function code({file, lang='java', src, hl=[]}){
  const lines = src.replace(/^\n/,'').replace(/\s+$/,'').split('\n');
  const body = lines.map((l,i) =>
    `<span class="ln${hl.includes(i+1)?' hl':''}"><span class="n">${i+1}</span>${hlLine(l, lang) || ' '}</span>`).join('');
  return `<figure class="code" aria-label="Código de ${esc(file)}"><header><span>${esc(file)}</span><span>${lang}</span></header><pre><code>${body}</code></pre></figure>`;
}
/** ConceptCard: definición corta y ejemplo */
const tbl = (head, rows) => `<div class="tblwrap"><table class="tbl"><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const concept = (layer, term, def, ex) =>
  `<article class="concept c-${layer}"><h4>${term}</h4><p>${def}</p><p class="ex">${ex}</p></article>`;
/** DecisionCard: decisión, motivo y trade-off */
const decision = ({d, why, cost}) =>
  `<dl class="decision"><div><dt>Decisión</dt><dd>${d}</dd></div><div><dt>Motivo</dt><dd>${why}</dd></div><div><dt>Trade-off</dt><dd>${cost}</dd></div></dl>`;
/** KnowledgeCheck: pregunta antes de revelar la respuesta */
const check = (q, a, hint='Pensadlo unos segundos antes de ver la solución.') =>
  `<section class="check" data-check><p class="q">${q}</p><p class="hint">${hint}</p><div class="a">${a}</div></section>`;
/** CommonMistake: error, efecto y corrección */
const mistake = (n, title, eff, fix) =>
  `<article class="mistake"><span class="num">${n}</span><div><h4>${title}</h4><p class="eff"><b>Efecto:</b> ${eff}</p><p class="fix"><b>Corrección:</b> ${fix}</p></div></article>`;
/** BeforeAfter */
const beforeAfter = (before, after, tb='Antes', ta='Después') =>
  `<div class="ba"><div class="before"><p class="tag">${tb}</p>${code(before)}</div><div class="after"><p class="tag">${ta}</p>${code(after)}</div></div>`;
const keys = arr => `<ul class="keys">${arr.map(k=>`<li>${k}</li>`).join('')}</ul>`;
const fig = (svg, cap) => `<figure class="figure">${svg}${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;

/* ---------- ArchitectureDiagram: hexágono que evoluciona ---------- */
function hex(stage='map'){
  const cx=320, cy=200;
  const pts = r => [0,60,120,180,240,300].map(a=>{const t=a*Math.PI/180;return `${(cx+r*Math.cos(t)).toFixed(1)},${(cy+r*Math.sin(t)).toFixed(1)}`}).join(' ');
  const focus = {
    map:['domain','app','in','out','adL','mongo','kafka'], domain:['domain'], in:['app','in','domain'],
    out:['app','out'], adapters:['adL','mongo','kafka','in','out'], swap:['mongo'],
    test:['adL','mongo','kafka','app','domain','in','out']
  }[stage];
  const op = g => focus.includes(g) ? 1 : (stage==='swap' ? .55 : .26);
  const hot = g => (stage==='swap' && g==='mongo') || (stage==='test' && ['adL','mongo','kafka'].includes(g));
  const port = (label,x,y) => `<g opacity="${op('out')}"><rect x="${x-52}" y="${y-12}" width="104" height="24" rx="12" fill="var(--surface)" stroke="var(--app)" stroke-width="1.6"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" fill="var(--app)">${label}</text></g>`;
  const box = (label,x,y1,h,g,sub) => `<g opacity="${op(g)}"><rect x="${x}" y="${y1}" width="104" height="${h}" rx="5" fill="var(--adapter-soft)" stroke="var(--adapter)" stroke-width="${hot(g)?2.4:1.4}" ${hot(g)?'stroke-dasharray="5 3"':''}/><text x="${x+52}" y="${y1+h/2+(sub?-2:5)}" text-anchor="middle" font-size="13" fill="var(--ink)">${label}</text>${sub?`<text x="${x+52}" y="${y1+h/2+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${sub}</text>`:''}</g>`;
  const arrow = (x1,y1,x2,y2,g) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#ah)" opacity="${op(g)}"/>`;
  const store = stage==='swap' || stage==='test' ? 'En memoria' : 'MongoDB';
  const bus = stage==='test' ? 'Fake eventos' : 'Kafka';
  return `<svg viewBox="0 0 640 400" role="img" aria-label="Diagrama hexagonal: adaptadores fuera, puertos en el borde, aplicación y dominio dentro">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--ink)"/></marker></defs>
    <g opacity="${op('app')}"><polygon points="${pts(150)}" fill="var(--app-soft)" stroke="var(--app)" stroke-width="2"/>
      <text x="${cx}" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="var(--app)">Aplicación</text>
      <text x="${cx}" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">AdoptPetService</text></g>
    <g opacity="${op('domain')}"><polygon points="${pts(72)}" fill="var(--domain-soft)" stroke="var(--domain)" stroke-width="2"/>
      <text x="${cx}" y="197" text-anchor="middle" font-size="15" font-weight="600" fill="var(--domain)">Dominio</text>
      <text x="${cx}" y="215" text-anchor="middle" font-size="11" fill="var(--muted)">Pet</text></g>

@Service
@RequiredArgsConstructor
public class PetService {

    private final PetMongoRepository repository;
    private final KafkaTemplate<String, PetAdoptedEvent> kafkaTemplate;

    public PetResponse adopt(String petId, AdoptPetRequest request) {
        PetDocument pet = repository.findById(petId)
                .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND));
        if (!"AVAILABLE".equals(pet.getStatus())) {
            throw new ResponseStatusException(HttpStatus.CONFLICT, "Pet not available");
        }

        pet.setStatus("ADOPTED");
        pet.setOwnerName(request.ownerName());
        PetDocument saved = repository.save(pet);
        kafkaTemplate.send("pet-adopted",
                new PetAdoptedEvent(saved.getId(), saved.getOwnerName()));
        return new PetResponse(saved.getId(), saved.getName(), saved.getStatus());
    }
}`,

public final class AdoptPetService implements AdoptPetUseCase {

    private final LoadPetPort loadPetPort;
    private final SavePetPort savePetPort;
    private final PublishPetAdoptedPort publishPetAdoptedPort;

    public AdoptPetService(LoadPetPort load, SavePetPort save,
                           PublishPetAdoptedPort publish) {
        this.loadPetPort = load;
        this.savePetPort = save;
        this.publishPetAdoptedPort = publish;
    }

    @Override
    public AdoptionResult adopt(AdoptPetCommand command) {
        Pet pet = loadPetPort.load(new PetId(command.petId()))
                .orElseThrow(() -> new PetNotFoundException(command.petId()));

        pet.adopt(new Owner(command.ownerName()));

        savePetPort.save(pet);
        publishPetAdoptedPort.publish(PetAdopted.from(pet));
        return AdoptionResult.from(pet);
    }
}`,

/* =========================================================
   Motor de navegación
   ========================================================= */
const flat = [];
MODULES.forEach((m, mi) => m.screens.forEach((s, si) => flat.push({mi, si})));
const planEnd = []; MODULES.reduce((acc,m,i)=> (planEnd[i] = acc + m.min), 0);
const revealed = new Set();
let idx = 0;

const $ = id => document.getElementById(id);
const screenEl = $('screen');

function parseHash(){
  const m = location.hash.match(/^#m(\d+)-s(\d+)$/);
  if (!m) return 0;
  const i = flat.findIndex(f => f.mi === +m[1] && f.si === +m[2] - 1);
  return i < 0 ? 0 : i;
}

function renderNav(){
  const cur = flat[idx].mi;
  $('navList').innerHTML = MODULES.map((m,i) => {
    const state = i < cur ? 'done' : i === cur ? 'current' : 'pending';
    const label = state==='done' ? 'completado' : state==='current' ? 'actual' : 'pendiente';
    return `<li><button data-mod="${i}" data-state="${state}" ${state==='current'?'aria-current="step"':''} aria-label="Módulo ${i}: ${m.title}, ${label}">
      <span class="dot">${state==='done' ? '✓' : i}</span><span><span class="t">${m.title}</span><span class="m">${m.min} min, ${m.screens.length} pantallas</span></span></button></li>`;
  }).join('');
}

function render(animate=true){
  const {mi, si} = flat[idx];
  const mod = MODULES[mi], scr = mod.screens[si];
  screenEl.innerHTML = `
    <div class="modhead"><b>Módulo ${mi}</b><span>${mod.min} min</span><span>Pantalla ${si+1} de ${mod.screens.length}</span></div>
    <h2>${si===0 && mi!==0 ? mod.title : scr.title}</h2>
    ${si===0 && mi!==0 ? `<p class="goal">${mod.goal}</p><h3 style="margin-top:0">${scr.title}</h3>` : ''}
    ${scr.body()}`;
  if (mi===0 && si===0) screenEl.querySelector('.modhead + h2').remove();
  screenEl.querySelectorAll('[data-check]').forEach(c => { if (revealed.has(idx)) c.classList.add('revealed'); });
  if (animate){ screenEl.classList.remove('enter'); void screenEl.offsetWidth; screenEl.classList.add('enter'); }
  $('stage').scrollTop = 0;

  const pct = Math.round((idx+1)/flat.length*100);
  $('bar').firstElementChild.style.width = pct + '%';
  $('bar').setAttribute('aria-valuenow', pct);
  $('progressText').textContent = `Pantalla ${idx+1} de ${flat.length}`;
  $('screenPos').textContent = `${mod.title}`;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === flat.length - 1;
  $('next').textContent = idx === flat.length - 1 ? 'Fin del recorrido' : 'Continuar';
  const hasCheck = !!screenEl.querySelector('[data-check]');
  $('reveal').disabled = !hasCheck || revealed.has(idx);
  $('notes').innerHTML = `<h4>Notas del ponente</h4><p>Plan acumulado al terminar este módulo: ${planEnd[mi]} min.</p><p>${scr.notes || 'Sin notas para esta pantalla.'}</p>`;
  renderNav();
  history.replaceState(null, '', `#m${mi}-s${si+1}`);
  updateTimer();
}

const go = i => { if (i>=0 && i<flat.length && i!==idx){ idx=i; render(); } };
function reveal(){
  const c = screenEl.querySelector('[data-check]');
  if (!c) return;
  c.classList.add('revealed'); revealed.add(idx); $('reveal').disabled = true;
}

/* Cronómetro de ensayo: compara con el plan acumulado del módulo actual */
let t0 = null, acc = 0, tick = null;
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function elapsed(){ return acc + (t0 ? (Date.now()-t0)/1000 : 0); }
function updateTimer(){
  const b = $('timer');
  if (!t0 && acc === 0){ b.textContent = 'Iniciar cronómetro'; b.classList.remove('late'); return; }
  const e = elapsed(), plan = planEnd[flat[idx].mi];
  b.textContent = `${fmt(e)} de ${plan} min${t0 ? '' : ' (pausa)'}`;
  b.classList.toggle('late', e/60 > plan);
}
function toggleTimer(){
  if (t0){ acc = elapsed(); t0 = null; clearInterval(tick); }
  else { t0 = Date.now(); tick = setInterval(updateTimer, 1000); }
  updateTimer();
}

function togglePresent(){
  const on = document.body.classList.toggle('presenting');
  $('presentBtn').textContent = on ? 'Salir de presentación' : 'Presentar';
  try {
    if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
    if (!on && document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  } catch(e){}
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('presenting')) togglePresent();
});

$('prev').onclick = () => go(idx-1);
$('next').onclick = () => go(idx+1);
$('reveal').onclick = reveal;
$('timer').onclick = toggleTimer;
$('notesBtn').onclick = () => $('notes').classList.toggle('open');
$('presentBtn').onclick = togglePresent;
$('navList').onclick = e => {
  const b = e.target.closest('[data-mod]'); if (!b) return;
  go(flat.findIndex(f => f.mi === +b.dataset.mod));
};
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  switch (e.key){
    case 'ArrowRight': case 'PageDown': e.preventDefault(); go(idx+1); break;
    case 'ArrowLeft':  case 'PageUp':   e.preventDefault(); go(idx-1); break;
    case 'Home': go(0); break;
    case 'End':  go(flat.length-1); break;
    case 's': case 'S': reveal(); break;
    case 'n': case 'N': $('notes').classList.toggle('open'); break;
    case 'p': case 'P': togglePresent(); break;
    case 't': case 'T': toggleTimer(); break;
    case 'Escape': $('notes').classList.remove('open'); break;
  }
});
window.addEventListener('hashchange', () => { const i = parseHash(); if (i !== idx){ idx = i; render(); } });

idx = parseHash();
render(false);
</script>
</body>
</html>
