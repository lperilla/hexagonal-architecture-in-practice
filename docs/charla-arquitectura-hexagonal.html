<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquitectura hexagonal en la práctica</title>
<style>
/* Identidad visual del cartel: oscuro por defecto (verde petróleo, núcleo naranja, hexágonos
   turquesa, texto crema). El modo claro conserva los mismos tonos (tecla C). */
:root{
  color-scheme: dark;
  --bg:#0E1A1E; --surface:#13242A; --surface-2:#1A3038; --ink:#F3EEE3; --muted:#A7B7B4; --line:#28434C;
  --domain:#F47A20; --domain-soft:#3A2416;
  --app:#E9B949;    --app-soft:#352E1A;
  --adapter:#2EC4B6; --adapter-soft:#123735;
  --good:#2EC4B6;   --good-soft:#123735;
  --risk:#F07167;   --risk-soft:#3C2023;
  --code-bg:#091316; --code-ink:#E2E9EC; --code-muted:#7D9098; --code-hl:#18303A;
  --tk-kw:#F0A86B; --tk-str:#A8D49A; --tk-ann:#E7C46B; --tk-type:#8FC1F0; --tk-com:#7D9098; --tk-num:#D9A0E0;
  --focus:#2EC4B6; --on-primary:#0E1A1E;
  --serif:"Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F6F1E7; --surface:#FFFFFF; --surface-2:#EEE6D7; --ink:#0E1A1E; --muted:#4D5F64; --line:#DDD3C2;
  --domain:#C55A0E; --domain-soft:#FBE4D2;
  --app:#8A6A12;    --app-soft:#F5EBCB;
  --adapter:#11796F; --adapter-soft:#D4F0EC;
  --good:#11796F;   --good-soft:#D4F0EC;
  --risk:#B3343F;   --risk-soft:#F6DFE1;
  --code-bg:#1D2A30; --code-hl:#2B3D45;
  --focus:#11796F; --on-primary:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.5;
  display:grid; grid-template-rows:auto 1fr auto; min-height:100vh;
}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:not-allowed; opacity:.45}

/* ---------- Cabecera ---------- */
.top{
  position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
  display:grid; grid-template-columns:auto 1fr auto; gap:24px; align-items:center; padding:10px 22px;
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--serif); font-size:1.05rem; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand small{display:block; color:var(--muted); font-size:.8rem}
.progress{display:flex; align-items:center; gap:12px; min-width:0}
.bar{flex:1; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--domain); width:0; transition:width .25s ease}
.progress span{font-size:.82rem; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.tools{display:flex; gap:8px; align-items:center}
.tool{
  border:1px solid var(--line); background:transparent; border-radius:6px; padding:6px 12px; font-size:.85rem;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.tool:hover{background:var(--surface-2)}
.tool.late{border-color:var(--risk); color:var(--risk)}

/* ---------- Estructura ---------- */
.frame{display:grid; grid-template-columns:300px 1fr; min-height:0}
.nav{border-right:1px solid var(--line); background:var(--surface); padding:14px 12px; overflow-y:auto}
.nav ol{list-style:none; margin:0; padding:0}
.nav li.blk{margin:14px 10px 4px; font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--adapter)}
.nav li.blk:first-child{margin-top:2px}
.nav li button{
  width:100%; text-align:left; display:grid; grid-template-columns:26px 1fr; gap:10px; align-items:start;
  background:transparent; border:0; border-radius:8px; padding:8px 10px; line-height:1.3;
}
.nav li button:hover{background:var(--surface-2)}
.nav .dot{
  width:22px; height:22px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center;
  font-size:.72rem; font-weight:600; color:var(--muted); margin-top:1px;
}
.nav .t{font-size:.92rem; display:block}
.nav .m{display:block; font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:2px}
.nav [data-state="current"]{background:var(--app-soft)}
.nav [data-state="current"] .dot{border-color:var(--app); color:var(--app)}
.nav [data-state="current"] .t{font-weight:600}
.nav [data-state="done"] .dot{background:var(--domain); border-color:var(--domain); color:var(--on-primary)}
.nav [data-state="done"] .t{color:var(--muted)}
.nav .legend{margin:18px 10px 0; font-size:.75rem; color:var(--muted); line-height:1.6}

.stage{overflow-y:auto; padding:30px 48px 60px}
.screen{max-width:1120px; margin:0 auto}
.screen.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .screen.enter{animation:none} .bar i{transition:none} }

.modhead{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:.9rem; margin-bottom:4px}
.modhead b{color:var(--adapter); font-weight:700; letter-spacing:.02em}
h2{font-family:var(--serif); font-weight:600; font-size:2.2rem; line-height:1.15; margin:0 0 6px; letter-spacing:-.01em}
.goal{color:var(--muted); margin:0 0 24px; max-width:70ch}
h3{font-family:var(--serif); font-weight:600; font-size:1.3rem; margin:26px 0 10px}
p{max-width:72ch}
.lead{font-size:1.12rem}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; align-items:start}
.split{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:28px; align-items:start}
code.i{font-family:var(--mono); font-size:.88em; background:var(--surface-2); padding:1px 5px; border-radius:4px}
.live{display:inline-block; background:var(--domain); color:var(--on-primary); border-radius:4px; padding:1px 8px; font-size:.78rem; font-weight:700; letter-spacing:.02em}

/* ---------- Componentes ---------- */
.concept{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--c); border-radius:4px 10px 10px 4px; padding:16px 18px}
.concept h4{margin:0 0 4px; font-family:var(--serif); font-size:1.15rem; color:var(--c)}
.concept p{margin:0 0 8px}
.concept .ex{font-size:.88rem; color:var(--muted)}
.c-domain{--c:var(--domain)} .c-app{--c:var(--app)} .c-adapter{--c:var(--adapter)}

.code{background:var(--code-bg); color:var(--code-ink); border-radius:10px; overflow:hidden; font-size:.84rem; margin:0 0 18px; border:1px solid #ffffff10}
.code header{display:flex; justify-content:space-between; gap:12px; padding:8px 14px; font-family:var(--mono); font-size:.78rem; color:var(--code-muted); border-bottom:1px solid #ffffff14}
.code pre{margin:0; padding:10px 0; overflow-x:auto; font-family:var(--mono); line-height:1.55}
/* Cada línea es una rejilla: número y texto. Las líneas largas se parten dentro del panel en lugar
   de obligar a desplazarse en horizontal durante la charla. */
.code .ln{display:grid; grid-template-columns:3.2em minmax(0,1fr); padding:0 14px 0 0; border-left:3px solid transparent}
.code .ln.hl{background:var(--code-hl); border-left-color:var(--tk-ann)}
.code .n{text-align:right; padding-right:1.1em; color:var(--code-muted); user-select:none}
.code .tx{white-space:pre-wrap; overflow-wrap:anywhere}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-ann{color:var(--tk-ann)} .tk-type{color:var(--tk-type)} .tk-com{color:var(--tk-com); font-style:italic} .tk-num{color:var(--tk-num)}

.ba{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px}
.ba .tag{font-size:.85rem; font-weight:600; margin:0 0 6px}
.ba .before .tag{color:var(--risk)} .ba .after .tag{color:var(--good)}

.decision{border:1px solid var(--app); border-radius:12px; background:var(--app-soft); padding:4px 0; margin:0 0 18px}
.decision div{display:grid; grid-template-columns:130px 1fr; gap:14px; padding:10px 18px}
.decision div + div{border-top:1px solid var(--line)}
.decision dt{font-weight:600; color:var(--app); margin:0}
.decision dd{margin:0}

.check{border:2px dashed var(--app); border-radius:14px; padding:22px 26px; margin:8px 0 18px; background:var(--surface)}
.check .q{font-family:var(--serif); font-size:1.55rem; line-height:1.3; margin:0 0 12px; max-width:40ch}
.check .hint{color:var(--muted); margin:0}
.check .a{display:none; margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
.check.revealed{border-style:solid}
.check.revealed .a{display:block}
.check.revealed .hint{display:none}
.check .a strong{color:var(--domain)}

.mistake{display:grid; grid-template-columns:44px 1fr; gap:14px; padding:14px 0; border-top:1px solid var(--line)}
.mistake:first-child{border-top:0}
.mistake .num{width:36px; height:36px; border-radius:50%; background:var(--risk-soft); color:var(--risk); display:grid; place-items:center; font-weight:700}
.mistake.good .num{background:var(--good-soft); color:var(--good)}
.mistake h4{margin:2px 0 4px; font-size:1.05rem}
.mistake p{margin:0; font-size:.95rem}
.mistake .fix{color:var(--good)}
.mistake .fix b, .mistake .eff b{font-weight:600}
.qa{padding:12px 0; border-top:1px solid var(--line)}
.qa:first-child{border-top:0; padding-top:0}
.qa h4{margin:0 0 4px; font-family:var(--serif); font-size:1.08rem; color:var(--adapter)}
.qa p{margin:0 0 6px; font-size:.95rem}
.qa p:last-child{margin-bottom:0}
.qa .ex{font-size:.88rem; color:var(--muted)}

.keys{list-style:none; padding:0; margin:0 0 18px}
.keys li{padding:8px 0 8px 22px; position:relative; border-bottom:1px solid var(--line); max-width:72ch}
.keys li::before{content:""; position:absolute; left:2px; top:17px; width:9px; height:9px; background:var(--domain); transform:rotate(45deg)}
.steps{padding-left:1.3em; margin:0 0 18px} .steps li{padding:3px 0}

.rule{font-family:var(--serif); font-size:1.5rem; line-height:1.35; border-left:4px solid var(--domain); padding:4px 0 4px 20px; margin:12px 0 22px; max-width:46ch}

.figure{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 0 18px}
.figure svg{width:100%; height:auto; display:block}
.figure figcaption{font-size:.85rem; color:var(--muted); padding:6px 6px 0}

.pyramid{display:flex; flex-direction:column; align-items:center; gap:6px; margin:6px 0 20px}
.pyramid div{padding:12px 16px; border-radius:6px; text-align:center; font-size:.95rem}
.pyramid small{display:block; color:var(--muted); font-size:.8rem}

.hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:36px; align-items:center; margin-top:10px}
.hero h2{font-size:3rem; line-height:1.05; letter-spacing:-.02em; margin-top:14px}
.hero .sub{font-size:1.5rem; color:var(--domain); font-family:var(--serif); margin:6px 0 22px}
.agenda{list-style:none; counter-reset:blk; padding:0; margin:0 0 18px}
.agenda li{counter-increment:blk; display:grid; grid-template-columns:40px 1fr; column-gap:12px; padding:9px 0; border-top:1px solid var(--line)}
.agenda li::before{content:counter(blk); grid-row:1/3; width:32px; height:32px; border-radius:50%; border:2px solid var(--adapter); color:var(--adapter); display:grid; place-items:center; font-weight:700}
.agenda b{font-size:1.08rem}
.agenda span{color:var(--muted); font-size:.92rem}
.stackline{color:var(--muted); font-size:.85rem; margin:0}
.big-q{font-family:var(--serif); font-size:2.6rem; line-height:1.2; max-width:24ch; margin:40px 0 20px; letter-spacing:-.01em}

.tblwrap{overflow-x:auto; margin:0 0 18px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.tbl{width:100%; border-collapse:collapse; font-size:.93rem}
.tbl th,.tbl td{padding:9px 14px; text-align:left; vertical-align:top; border-top:1px solid var(--line)}
.tbl thead th{background:var(--surface-2); border-top:0; font-weight:600}
.tbl td:first-child{font-weight:600}
/* ---------- Pie ---------- */
.foot{border-top:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 22px}
.foot .grp{display:flex; gap:10px; align-items:center}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 18px; font-weight:600}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--app); border-color:var(--app); color:var(--on-primary)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08); background:var(--app)}
.kbd{font-size:.78rem; color:var(--muted)}

.notes{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:2px solid var(--domain); padding:16px 26px 22px; max-height:40vh; overflow-y:auto; box-shadow:0 -8px 24px #0006; display:none}
.notes.open{display:block}
.notes h4{margin:0 0 6px; color:var(--domain)}
.notes p{margin:0 0 6px}
.cut{display:inline-block; background:var(--app-soft); color:var(--app); border-radius:4px; padding:1px 8px; font-size:.82rem; font-weight:600}

/* ---------- Modo presentación ---------- */
body.presenting .frame{grid-template-columns:1fr}
body.presenting .nav{display:none}
body.presenting{font-size:19px}
body.presenting .stage{padding:30px 56px 50px}
body.presenting .code{font-size:.76rem}
body.presenting .screen{max-width:1400px}

/* ---------- Responsive ---------- */
@media (max-width: 1000px){
  .frame{grid-template-columns:1fr}
  .nav{border-right:0; border-bottom:1px solid var(--line); padding:8px}
  .nav ol{display:flex; overflow-x:auto; gap:4px}
  .nav li.blk{display:none}
  .nav li button{grid-template-columns:24px auto; white-space:nowrap}
  .nav .m, .nav .legend{display:none}
  .grid2,.grid3,.split,.ba,.hero{grid-template-columns:1fr}
  .stage{padding:22px 16px 50px}
  .hero h2{font-size:2.2rem}
  h2{font-size:1.7rem}
  .big-q{font-size:1.8rem}
  .top{grid-template-columns:1fr auto; gap:10px}
  .progress{grid-column:1/-1; grid-row:2}
  .kbd{display:none}
}
@media (max-width: 560px){
  .brand small,.tool.opt{display:none}
  .decision div{grid-template-columns:1fr; gap:2px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><polygon points="28,15 21.5,26.3 8.5,26.3 2,15 8.5,3.7 21.5,3.7" fill="none" stroke="var(--adapter)" stroke-width="2"/><polygon points="20,15 17.5,19.3 12.5,19.3 10,15 12.5,10.7 17.5,10.7" fill="var(--domain)"/></svg>
    <div><h1>Arquitectura hexagonal en la práctica</h1><small>Del diseño al código · 4 de diciembre de 2026 · 50 minutos y 10 de preguntas</small></div>
  </div>
  <div class="progress" aria-live="polite">
    <div class="bar" role="progressbar" aria-label="Progreso del recorrido" aria-valuemin="0" aria-valuemax="100" id="bar"><i></i></div>
    <span id="progressText"></span>
  </div>
  <div class="tools">
    <button class="tool" id="timer" title="Cronómetro de ensayo (T)">Iniciar cronómetro</button>
    <button class="tool opt" id="notesBtn" title="Notas del ponente (N)">Notas</button>
    <button class="tool opt" id="themeBtn" title="Modo claro u oscuro (C)">Modo claro</button>
    <button class="tool" id="presentBtn" title="Modo presentación (P)">Presentar</button>
  </div>
</header>

<div class="frame">
  <nav class="nav" aria-label="Bloques y módulos de la charla">
    <ol id="navList"></ol>
    <p class="legend">Flechas o mando: avanzar y retroceder<br>S: ver solución<br>N: notas<br>P: presentar<br>T: cronómetro<br>C: modo claro u oscuro</p>
  </nav>
  <main class="stage" id="stage"><div class="screen" id="screen"></div></main>
</div>

<footer class="foot">
  <div class="grp"><button class="btn" id="prev">Anterior</button><span class="kbd" id="screenPos"></span></div>
  <div class="grp"><button class="btn" id="reveal">Ver solución</button><button class="btn primary" id="next">Continuar</button></div>
</footer>

<aside class="notes" id="notes" aria-label="Notas del ponente"></aside>

<script>
/* =========================================================
   Utilidades y componentes
   ========================================================= */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const JAVA_RE = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(@[A-Za-z]+)|\b(public|private|protected|final|class|interface|record|static|return|new|if|else|throw|throws|void|int|boolean|implements|extends|import|package|this|null|true|false|var|for|try|catch|switch|case|default)\b|\b([A-Z][A-Za-z0-9_]*)\b|\b(\d+)\b/g;
function hlLine(line, lang){
  if (lang === 'java'){
    let out = '', last = 0;
    line.replace(JAVA_RE, (m, com, str, ann, kw, type, num, off) => {
      out += esc(line.slice(last, off));
      const cls = com ? 'com' : str ? 'str' : ann ? 'ann' : kw ? 'kw' : type ? 'type' : 'num';
      out += `<span class="tk-${cls}">${esc(m)}</span>`;
      last = off + m.length; return m;
    });
    return out + esc(line.slice(last));
  }
  if (lang === 'bash' || lang === 'yaml'){
    const i = line.indexOf('#');
    return i >= 0 ? esc(line.slice(0,i)) + `<span class="tk-com">${esc(line.slice(i))}</span>` : esc(line);
  }
  return esc(line);
}

/** CodePanel: archivo, lenguaje y líneas resaltadas */
function code({file, lang='java', src, hl=[]}){
  const lines = src.replace(/^\n/,'').replace(/\s+$/,'').split('\n');
  const body = lines.map((l,i) =>
    `<span class="ln${hl.includes(i+1)?' hl':''}"><span class="n">${i+1}</span><span class="tx">${hlLine(l, lang) || ' '}</span></span>`).join('');
  return `<figure class="code" aria-label="Código de ${esc(file)}"><header><span>${esc(file)}</span><span>${lang}</span></header><pre><code>${body}</code></pre></figure>`;
}
const tbl = (head, rows) => `<div class="tblwrap"><table class="tbl"><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
/** ConceptCard: definición corta y ejemplo */
const concept = (layer, term, def, ex) =>
  `<article class="concept c-${layer}"><h4>${term}</h4><p>${def}</p><p class="ex">${ex}</p></article>`;
/** DecisionCard: decisión, motivo y trade-off */
const decision = ({d, why, cost}) =>
  `<dl class="decision"><div><dt>Decisión</dt><dd>${d}</dd></div><div><dt>Motivo</dt><dd>${why}</dd></div><div><dt>Trade-off</dt><dd>${cost}</dd></div></dl>`;
/** KnowledgeCheck: pregunta antes de revelar la respuesta */
const check = (q, a, hint='Pensadlo unos segundos antes de ver la solución.') =>
  `<section class="check" data-check><p class="q">${q}</p><p class="hint">${hint}</p><div class="a">${a}</div></section>`;
/** CommonMistake: error, efecto y corrección */
const mistake = (n, title, eff, fix) =>
  `<article class="mistake"><span class="num">${n}</span><div><h4>${title}</h4><p class="eff"><b>Efecto:</b> ${eff}</p><p class="fix"><b>Corrección:</b> ${fix}</p></div></article>`;
/** GoodPractice: práctica, motivo y dónde está en el código */
const good = (n, title, why, where) =>
  `<article class="mistake good"><span class="num">${n}</span><div><h4>${title}</h4><p class="eff"><b>Por qué:</b> ${why}</p><p class="fix"><b>En el código:</b> ${where}</p></div></article>`;
/** BeforeAfter */
const beforeAfter = (before, after, tb='Antes', ta='Después') =>
  `<div class="ba"><div class="before"><p class="tag">${tb}</p>${code(before)}</div><div class="after"><p class="tag">${ta}</p>${code(after)}</div></div>`;
/** Pregunta frecuente: pregunta, respuesta y, opcionalmente, ejemplo del repositorio */
const qa = (q, a, ex) => `<article class="qa"><h4>${q}</h4><p>${a}</p>${ex ? `<p class="ex">${ex}</p>` : ''}</article>`;
const keys = arr => `<ul class="keys">${arr.map(k=>`<li>${k}</li>`).join('')}</ul>`;
const fig = (svg, cap) => `<figure class="figure">${svg}${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;
/** Marca de código en vivo para las notas del ponente */
const live = where => `<span class="live">En vivo</span> ${where}`;
const cut = saving => `<span class="cut">Recortable</span> ${saving}`;

/* ---------- ArchitectureDiagram: hexágono que evoluciona ---------- */
function hex(stage='map'){
  const cx=320, cy=200;
  const pts = r => [0,60,120,180,240,300].map(a=>{const t=a*Math.PI/180;return `${(cx+r*Math.cos(t)).toFixed(1)},${(cy+r*Math.sin(t)).toFixed(1)}`}).join(' ');
  const focus = {
    map:['domain','app','in','out','rest','soap','mongo','rabbit'], domain:['domain'], in:['app','in','domain'],
    out:['app','out'], adapters:['rest','soap','mongo','rabbit','in','out'], swap:['mongo'],
    test:['rest','mongo','rabbit','app','domain','in','out'], soap:['rest','soap','in','app']
  }[stage];
  const op = g => focus.includes(g) ? 1 : (stage==='swap' ? .55 : .26);
  const hot = g => (stage==='swap' && g==='mongo') || (stage==='test' && ['rest','mongo','rabbit'].includes(g)) || (stage==='soap' && g==='soap');
  const port = (label,x,y) => `<g opacity="${op('out')}"><rect x="${x-52}" y="${y-12}" width="104" height="24" rx="12" fill="var(--surface)" stroke="var(--app)" stroke-width="1.6"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" fill="var(--app)">${label}</text></g>`;
  const box = (label,x,y1,h,g,sub) => `<g opacity="${op(g)}"><rect x="${x}" y="${y1}" width="104" height="${h}" rx="5" fill="var(--adapter-soft)" stroke="var(--adapter)" stroke-width="${hot(g)?2.4:1.4}" ${hot(g)?'stroke-dasharray="5 3"':''}/><text x="${x+52}" y="${y1+h/2+(sub?-2:5)}" text-anchor="middle" font-size="13" fill="var(--ink)">${label}</text>${sub?`<text x="${x+52}" y="${y1+h/2+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${sub}</text>`:''}</g>`;
  const arrow = (x1,y1,x2,y2,g) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#ah)" opacity="${op(g)}"/>`;
  const store = stage==='swap' || stage==='test' ? 'En memoria' : 'MongoDB';
  const bus = stage==='test' ? 'Publicador fake' : 'RabbitMQ';
  return `<svg viewBox="0 0 640 400" role="img" aria-label="Diagrama hexagonal: adaptadores fuera, puertos en el borde, aplicación y dominio dentro">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--ink)"/></marker></defs>
    <g opacity="${op('app')}"><polygon points="${pts(150)}" fill="var(--app-soft)" stroke="var(--app)" stroke-width="2"/>
      <text x="${cx}" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="var(--app)">Aplicación</text>
      <text x="${cx}" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">AdoptPetService</text></g>
    <g opacity="${op('domain')}"><polygon points="${pts(72)}" fill="var(--domain-soft)" stroke="var(--domain)" stroke-width="2"/>
      <text x="${cx}" y="197" text-anchor="middle" font-size="15" font-weight="600" fill="var(--domain)">Dominio</text>
      <text x="${cx}" y="215" text-anchor="middle" font-size="11" fill="var(--muted)">Pet</text></g>
    <g opacity="${op('in')}"><rect x="128" y="188" width="104" height="24" rx="12" fill="var(--surface)" stroke="var(--app)" stroke-width="1.6"/><text x="180" y="204" text-anchor="middle" font-size="12" fill="var(--app)">Adoptar mascota</text></g>
    ${port('Cargar mascota',432,135)}${port('Guardar mascota',470,200)}${port('Publicar evento',432,265)}
    ${box(stage==='test'?'Test JUnit':'REST',0,146,36,'rest')}
    ${box('SOAP',0,218,36,'soap')}
    ${arrow(104,164,126,193,'rest')}${arrow(104,236,126,207,'soap')}
    ${box(store,534,112,110,'mongo', stage==='swap'?'antes: MongoDB':'')}
    ${box(bus,534,247,36,'rabbit')}
    ${arrow(534,135,486,135,'mongo')}${arrow(534,200,524,200,'mongo')}${arrow(534,265,486,265,'rabbit')}
  </svg>`;
}

@Service
@RequiredArgsConstructor
public class PetService {

    private final PetRepository petRepository;
    private final RabbitTemplate rabbitTemplate;

    public PetDocument adopt(String petId, String ownerName) {
        PetDocument pet = petRepository.findById(petId)
                .orElseThrow(() -> new ResponseStatusException(
                        HttpStatus.NOT_FOUND, "La mascota " + petId + " no existe"));

        if (!PetDocument.AVAILABLE.equals(pet.getStatus())) {
            throw new ResponseStatusException(
                    HttpStatus.CONFLICT, "La mascota " + petId + " no está disponible para adopción");
        }

        pet.setStatus(PetDocument.ADOPTED);
        pet.setOwnerName(ownerName);
        PetDocument adopted = petRepository.save(pet);

        rabbitTemplate.convertAndSend(RabbitConfig.EXCHANGE, RabbitConfig.PET_ADOPTED_ROUTING_KEY,
                new PetAdoptedMessage(adopted.getId(), adopted.getName(), adopted.getOwnerName(), Instant.now()));
        return adopted;
    }
}`,

@RequiredArgsConstructor
public class AdoptPetService implements AdoptPetUseCase {

    private final LoadPetPort loadPetPort;
    private final SavePetPort savePetPort;
    private final PublishPetAdoptedPort publishPetAdoptedPort;
    private final Clock clock;

    @Override
    public AdoptionResult adopt(AdoptPetCommand command) {
        Pet pet = loadPetPort.loadPet(command.petId())
                .orElseThrow(() -> new PetNotFoundException(command.petId()));

        Pet adopted = pet.adopt(command.owner());

        savePetPort.savePet(adopted);
        publishPetAdoptedPort.publish(PetAdopted.of(adopted, clock.instant()));
        return AdoptionResult.from(adopted);
    }
}`,

protected void customizeFault(Object endpoint, Exception ex, SoapFault fault) {
    JAXBElement<AdoptionFault> detail = switch (ex) {

public class NotifyAdoptionService implements NotifyAdoptionUseCase {

    private final SendNotificationPort sendNotificationPort;
    private final NotifiedAdoptionsPort notifiedAdoptionsPort;
    private final EmailAddress shelter;

    @Override
    public NotificationResult notifyAdoption(NotifyAdoptionCommand command) {
        Adoption adoption = command.toAdoption();
        if (notifiedAdoptionsPort.isNotified(adoption.key())) {
            return NotificationResult.ALREADY_NOTIFIED;
        }

        sendNotificationPort.send(Notification.adoptionNotice(adoption, shelter));

        // Se marca después de enviar: si el envío falla, el reintento volverá a intentarlo
        notifiedAdoptionsPort.markNotified(adoption.key());
        return NotificationResult.SENT;
    }
}`,

  { title:'Pieza a pieza', body:()=>`

{ block:2, title:'Errores frecuentes y buenas prácticas', min:6, goal:'Evitar una aplicación superficial o dogmática.', screens:[
  { title:'Errores de estructura', body:()=>`
    <div class="grid2"><div>
      ${mistake(1,'Renombrar paquetes sin invertir dependencias','domain importa documentos Mongo, repositorios Spring o DTOs.','módulos Maven y reglas de ArchUnit.')}
      ${mistake(2,'DTO generado usado como modelo de dominio','cualquier cambio del contrato contamina las reglas.','el código generado no sale de su módulo de API; mappers explícitos.')}
    </div><div>
      ${mistake(3,'Lógica de negocio en adaptadores','las reglas se duplican entre REST, SOAP y RabbitMQ.','concentrarlas en dominio o aplicación según su naturaleza.')}
      ${mistake(4,'El negocio habla el idioma del canal','ResponseStatusException en el servicio, y SOAP adivinando códigos HTTP.','excepciones de dominio, traducidas solo en el adaptador de cada canal.')}
    </div></div>`,
    notes:'El error 4 es el que vimos en el bloque 1 con el endpoint SOAP de mvc.' },
  { title:'Errores de criterio', body:()=>`
    <div class="grid2"><div>
      ${mistake(5,'Modelo anémico por obligación','el servicio contiene todas las reglas, como el setStatus de mvc.','proteger invariantes en el modelo que las posee, como Pet.adopt().')}
      ${mistake(6,'Ignorar transacciones y consistencia','MongoDB confirma pero RabbitMQ falla.','outbox, reintentos, idempotencia y observabilidad.')}
    </div><div>
      ${mistake(7,'Un puerto por cada clase','exceso de interfaces ceremoniales.','puertos por capacidad y frontera real.')}
      ${mistake(8,'Aplicarla a un CRUD trivial','más ficheros y coste cognitivo sin beneficio.','modularidad proporcional al riesgo y a la complejidad del dominio.')}
    </div></div>`,
    notes:cut('Si vamos tarde, quedarse solo con el error 8 (ahorra 2 min). Es el que evita presentar hexagonal como solución universal.') },
  { title:'Buenas prácticas', body:()=>`
    <div class="grid2"><div>
      ${good(1,'Contratos antes que código','el contrato es la fuente de verdad y se puede revisar antes de programar.','OpenAPI, WSDL y XSD, y el evento en contracts/events, en las dos ramas.')}
      ${good(2,'Un solo sitio para traducir cada canal','los errores se ven igual vengan de donde vengan.','RestExceptionHandler y AdoptionFaultResolver.')}
      ${good(3,'Composición explícita','el núcleo no depende del framework.','AdoptPetService sin @Service, registrado en boot.')}
      ${good(4,'Un dominio inmutable','nadie se salta la regla ni deja estados a medias.','Pet es un record: adopt() devuelve una mascota nueva.')}
    </div><div>
      ${good(5,'Un adaptador, un puerto','cada clase hace una sola cosa y se sustituye por separado.','MongoLoadPetAdapter y MongoSavePetAdapter; ArchUnit lo comprueba.')}
      ${good(6,'Tests que no conocen la implementación','prueban el comportamiento, no la estructura.','los tests de extremo a extremo son el mismo fichero en mvc y hexagonal y pasan en cada etiqueta.')}
      ${good(7,'Consumidores tolerantes e idempotentes','el productor puede evolucionar y los mensajes pueden llegar dos veces.','clase propia, campos desconocidos ignorados, DLQ y un email por adopción.')}
    </div></div>`,
    notes:'Mismo formato que los errores, en positivo. Cada práctica señala dónde está en el repositorio. Las 4 y 5 son las que más se discuten: inmutabilidad y un puerto por adaptador.' },
  { title:'Que la arquitectura se compruebe sola', body:()=>`
    <div class="split"><div>${code({file:'boot/.../ArchitectureTest.java', src:SRC.archunit, hl:[9,10,16,17]})}</div>
    <div><p class="lead">Dos defensas que se complementan:</p>
    ${keys(['<b>Maven</b>: si domain no declara Spring, importar Spring no compila.','<b>ArchUnit</b>: lo que Maven no ve. Que los puertos no usen tipos técnicos, que el código generado no salga de su adaptador, que los adaptadores no se conozcan y que cada adaptador implemente un único puerto.'])}</div></div>`,
    notes:'La corrección del error 1, en código. Si da tiempo, enseñar en vivo el error de compilación al importar @Component en Pet.' }
]},

{ block:3, title:'Decisiones de diseño', min:4, goal:'Explicar por qué el código es como es, y cuándo merece la pena.', screens:[
  { title:'API first y contract first', body:()=>`
    <div class="split"><div>${code({file:'api-contract/.../adoption-api.yaml (resumen)', lang:'yaml', src:SRC.openapi})}${code({file:'AdoptionApi.java (generada)', src:SRC.generated})}</div>
    <div>${keys(['Los contratos REST y SOAP se escriben y se revisan antes que el código.','No depende de la arquitectura: la rama mvc también genera desde los contratos.','El código generado es un detalle del adaptador: nunca llega al dominio ni a los puertos.','Cada servicio genera sus propias clases. Sin librería de DTOs compartida, los despliegues no se acoplan.'])}</div></div>`,
    notes:'Anécdota útil: el XSD se llama adoption-types.xsd porque Spring WS no publica un WSDL y un XSD con el mismo nombre. Los contratos también tienen restricciones técnicas.' },
  { title:'Decisiones de diseño', body:()=>`
    ${tbl(['Decisión','Por qué'],[
      ['Dominio con records inmutables','Adoptar devuelve una mascota nueva: nadie se salta la regla ni deja estados a medias'],
      ['Puertos sin detalles técnicos','Los tipos son de dominio: Pet, no PetDocument ni DTOs'],
      ['LoadPetPort y SavePetPort separados, un adaptador por puerto','Cada uso pide solo lo que necesita y cada adaptador hace una sola cosa (ArchUnit lo comprueba)'],
      ['Puertos de salida en domain','Variante válida: lo importante es que los define el núcleo'],
      ['Publicación sin outbox en la demo','Foco en los límites; en producción, outbox'],
      ['Servicio de aplicación sin @Service','El núcleo no depende de Spring; se compone en boot'],
      ['Un groupId por servicio y módulos sin prefijo','domain y application son distintos en cada servicio'],
      ['Módulos solo donde hacen falta','notification-service no tiene módulos de API'],
      ['El registro de mascotas se queda en capas (fase 3)','Un CRUD sin reglas no gana nada con hexagonal']])}`,
    notes:'No leer la tabla: elegir dos o tres según el público.' },
  { title:'Cuándo sí y cuándo no', body:()=>`
    <div class="grid2"><div>
      <h3 style="margin-top:0">Sí</h3>${keys(['Reglas de negocio que merecen protegerse.','Varios canales de entrada o salida.','Vida larga y tecnología que cambiará.','Equipos que necesitan probar el negocio rápido.'])}
    </div><div>
      <h3 style="margin-top:0">No, o todavía no</h3>${keys(['CRUD sin reglas: el registro de mascotas.','Prototipos y scripts de vida corta.','Equipos sin tiempo para la disciplina que exige.','Cuando un puerto solo existe por costumbre.'])}
    </div></div>
    <p class="rule">Modularidad proporcional al riesgo, a la vida útil y a la complejidad del dominio.</p>`,
    notes:'' },
  { title:'Hexagonal, DDD y SOLID', body:()=>`
    <div class="grid2">
      ${concept('app','Arquitectura hexagonal','Decide dónde está la frontera entre negocio y tecnología, y hacia dónde apuntan las dependencias.','¿Qué puede cambiar sin tocar el negocio?')}
      ${concept('domain','DDD','Decide cómo modelar el negocio dentro de esa frontera, con el lenguaje de los expertos.','¿Qué conceptos y reglas tiene el negocio? Pet es la raíz de su agregado; PetId y Owner, objetos valor; PetAdopted, un evento.')}
    </div>
    ${tbl(['Principio SOLID','Dónde lo hemos visto'],[
      ['S: responsabilidad única','AdoptionController cambia si cambia la API; MongoSavePetAdapter, si cambia cómo se guarda; Pet, si cambia la regla'],
      ['O: abierto/cerrado','Los adaptadores en memoria y el canal SOAP se añaden sin tocar AdoptPetService'],
      ['L: sustitución de Liskov','PetPersistenceContract: Mongo y memoria pasan los mismos tests'],
      ['I: segregación de interfaces','LoadPetPort y SavePetPort separados'],
      ['D: inversión de dependencias','El núcleo define SavePetPort y el adaptador la implementa']])}`,
    notes:cut('Material de consulta. Si sobra tiempo, la frase clave: la D de SOLID es la hexagonal aplicada a una clase (ahorra 2 min).') }

{ block:5, title:'Dudas y respuestas', min:0, goal:'Material de consulta para el turno de preguntas. No cuenta en los 50 minutos.', screens:[
  { title:'Dominio, entidad y agregado', body:()=>`
    <div class="grid2"><div>
      ${qa('¿Qué es el dominio?','El problema de negocio y sus reglas, con el lenguaje de los expertos: qué es una mascota, cuándo puede adoptarse y qué ocurre al hacerlo. No incluye cómo se guarda, cómo se expone ni cómo se envía.','En el código: el módulo <code class="i">domain</code>, sin Spring ni Lombok.')}
      ${qa('¿Qué es una entidad?','Un objeto con identidad: dos mascotas con el mismo nombre siguen siendo distintas porque tienen distinto <code class="i">PetId</code>. Su estado cambia a lo largo del tiempo, su identidad no.','<code class="i">Pet</code>.')}
    </div><div>
      ${qa('¿Qué es un agregado y para qué sirve?','Un grupo de objetos que se tratan como una unidad de consistencia, con una raíz que es la única puerta de entrada. Sirve para proteger las invariantes: nadie modifica una pieza interna saltándose a la raíz, y se guarda y se carga completo.','<code class="i">Pet</code> es la raíz; <code class="i">PetId</code> y <code class="i">Owner</code> son sus objetos valor.')}
      ${qa('¿Por qué un agregado lleva su propia lógica de negocio?','Porque es quien conoce sus invariantes. Si la regla vive en un servicio, cualquiera puede cambiar el estado sin pasar por ella y acaba duplicada en cada canal (modelo anémico). Con la regla dentro, es imposible crear una mascota adoptada sin dueño.','mvc: <code class="i">setStatus</code> en el servicio. hexagonal: <code class="i">Pet.adopt(owner)</code>.')}
    </div></div>`,
    notes:'Preguntas más habituales. Anclar cada respuesta en Pet. Si preguntan por modelo anémico, remitir al error 5 del bloque 2.' },
  { title:'Value objects e inmutabilidad', body:()=>`
    <div class="grid2"><div>
      ${qa('¿Qué es un value object?','Un objeto sin identidad, definido solo por sus valores: dos <code class="i">Owner</code> con el mismo nombre son intercambiables. Valida sus datos al crearse y puede llevar comportamiento propio.','<code class="i">PetId</code>, <code class="i">Owner</code>, <code class="i">EmailAddress</code>.')}
      ${qa('¿Por qué un value object debe ser inmutable?','Porque su valor es su identidad: si pudiera cambiar, dejaría de ser el mismo valor. Además se comparte sin copias, sirve de clave en mapas y conjuntos y, si se validó al crearse, sigue siendo válido siempre.')}
    </div><div>
      ${qa('¿Por qué las entidades de dominio deben ser inmutables?','Inmutable no significa que no cambie, sino que cada cambio devuelve una instancia nueva con la misma identidad. La regla queda en un único método y no hay setters para saltársela ni estados a medias.','<code class="i">pet.adopt(owner)</code> devuelve una mascota nueva, ya adoptada.')}
      ${qa('¿Por qué los comandos son inmutables?','Un comando es la intención del usuario en un instante: «adoptar esta mascota con este dueño». Si se pudiera modificar por el camino, lo ejecutado no sería lo pedido. Además es un mensaje que se registra, se reintenta o se encola.','<code class="i">AdoptPetCommand(PetId, Owner)</code> es un <code class="i">record</code>.')}
    </div></div>`,
    notes:'La clave: inmutable no es "no cambia", es "cambiar produce otro objeto". Si preguntan por el rendimiento, remitir a la pantalla siguiente.' },
  { title:'La importancia de lo inmutable', body:()=>`
    ${tbl(['Sin inmutabilidad','Con inmutabilidad'],[
      ['Cualquiera con una referencia puede llamar a un setter y saltarse la regla','El único camino es el método del modelo, que protege la invariante'],
      ['Objetos a medio cambiar: la mascota con estado adoptada y sin dueño','Un objeto siempre es válido desde que se construye hasta que se descarta'],
      ['Copias defensivas al compartir objetos entre capas o hilos','Se comparten sin copias y sin sincronización (el almacén en memoria guarda <code class="i">Pet</code> tal cual)'],
      ['Los tests comprueban qué campos cambiaron y en qué orden','Los tests comparan valores: entra una mascota, sale otra'],
      ['Efectos laterales difíciles de rastrear entre capas','Cada cambio es explícito: se ve dónde se crea el objeto nuevo']])}
    <div class="grid2" style="margin-top:14px"><div>
      ${qa('¿No es caro crear objetos nuevos todo el tiempo?','En un caso de uso son unos pocos objetos pequeños y de vida corta, que la JVM gestiona muy bien. El cuello de botella real es MongoDB o la red, no el record.')}
    </div><div>
      ${qa('¿Cómo se guarda entonces un objeto inmutable?','El adaptador lo traduce a su modelo técnico (<code class="i">PetDocument</code>, mutable si hace falta) con un mapper. El dominio no sabe que existe.')}
    </div></div>`,
    notes:'Cerrar con la idea: la inmutabilidad convierte una convención ("no toques esto") en una garantía del compilador.' },
  { title:'Casos de uso y reglas', body:()=>`
    <div class="grid2"><div>
      ${qa('¿Por qué un caso de uso no debe usar otro caso de uso?','Cada caso de uso es una intención completa con su propia frontera: validación, autorización y transacción. Si uno llama a otro, esas fronteras se anidan y el flujo se vuelve oculto, con dependencias circulares que se descubren tarde y tests que arrastran media aplicación. Además, los adaptadores (REST, SOAP, mensajes) deben poder invocar cada caso de uso por separado.','Qué hacer: si es una regla compartida, va al dominio (agregado o servicio de dominio); si es coordinación común, a un componente de aplicación o a un puerto; si es una reacción, a un evento.')}
    </div><div>
      ${qa('¿Qué va en el caso de uso y qué en el dominio?','El dominio decide (¿puede adoptarse?); el caso de uso orquesta: carga la mascota, llama a <code class="i">pet.adopt(owner)</code>, la guarda y publica el evento. Si una línea es una regla de negocio y está en el caso de uso, probablemente es del modelo.','<code class="i">AdoptPetService</code> frente a <code class="i">Pet.adopt()</code>.')}
      ${qa('¿Qué es un servicio de dominio?','Una regla que no pertenece a una sola entidad, por ejemplo la elegibilidad de un adoptante que depende de varios datos. Sigue siendo Java puro y sin estado, y se usa antes de crear un servicio de aplicación para ello.')}
      ${qa('¿Qué es un evento de dominio?','Un hecho que ya ocurrió, con nombre en pasado: <code class="i">PetAdopted</code>. El núcleo lo crea y un puerto lo publica; quién reacciona (notificaciones, registro) no es asunto del caso de uso.')}
    </div></div>`,
    notes:'La primera pregunta es de las que más salen. Ejemplo corto: "AdoptPet llamando a NotifyAdoption" ya es acoplamiento; la respuesta es el evento pet.adopted, que es lo que hace notification-service.' },
  { title:'Puertos, adaptadores y contratos', body:()=>`
    <div class="grid2"><div>
      ${qa('¿Qué diferencia hay entre puerto y adaptador?','El puerto es la interfaz que define el núcleo, en su lenguaje (<code class="i">SavePetPort</code>). El adaptador es la clase que la implementa con una tecnología concreta (<code class="i">MongoSavePetAdapter</code>).')}
      ${qa('¿Dónde se valida?','El formato en el borde (OpenAPI, XSD): un nombre vacío no llega al núcleo. Las reglas de negocio, en el dominio: una mascota no disponible no se adopta venga por el canal que venga. Un mismo dato puede pasar por las dos comprobaciones y cada una responde a una pregunta distinta.')}
    </div><div>
      ${qa('¿Mapear entre DTO, dominio y documento no es duplicar código?','Es duplicación aparente: cada modelo cambia por razones distintas (contrato, regla, almacenamiento). Sin mappers, un cambio en el JSON de la API acabaría tocando las reglas.','Es el coste que se admite en la tabla de ventajas y costes.')}
      ${qa('¿Por qué no compartir una librería de DTOs entre servicios?','Porque acopla los despliegues: cambiar una clase obliga a recompilar y desplegar a todos. Cada servicio genera sus propias clases a partir del contrato, que sí es la fuente de verdad.')}
    </div></div>`,
    notes:'Si la pregunta es sobre excepciones, recordar: el dominio lanza excepciones propias y solo api-rest y api-soap las traducen a HTTP y a faults.' },
  { title:'Decisiones del día a día', body:()=>`
    <div class="grid2"><div>
      ${qa('¿Hexagonal necesita DDD, o al revés?','No. Hexagonal decide dónde está la frontera entre negocio y tecnología; DDD decide cómo modelar el negocio dentro. Se combinan bien, pero se pueden usar por separado.')}
      ${qa('¿Cuándo creo un puerto nuevo?','Cuando el núcleo necesita algo del exterior (guardar, consultar, notificar) o una frontera puede cambiar. Si solo existe por costumbre, es ceremonia.')}
      ${qa('¿Cómo pruebo cada capa?','Dominio y caso de uso, en Java puro y con dobles escritos a mano. Adaptadores, con tests de integración y un contrato común. De extremo a extremo, un único fichero que no conoce la implementación.')}
    </div><div>
      ${qa('¿Dónde van las transacciones?','La frontera transaccional es el caso de uso. Como la capa de aplicación no lleva anotaciones de Spring, se aplica desde fuera, en <code class="i">boot</code> (por ejemplo, con un decorador del caso de uso). Entre MongoDB y RabbitMQ no hay transacción compartida: de ahí el outbox, la idempotencia y los reintentos.')}
      ${qa('¿Y la seguridad y los logs?','La autenticación es del canal: filtros de Spring en los adaptadores. La autorización de negocio («solo un adoptante apto») es una regla de dominio o de aplicación. Los logs técnicos van en los adaptadores.')}
      ${qa('¿Cómo empiezo en un proyecto existente?','Como hicimos aquí, sin reescribir: primero el dominio, luego el puerto de entrada, después los de salida y los adaptadores. Cada paso compila y pasa los tests.','Etiquetas <code class="i">00-start</code> a <code class="i">09-final</code>.')}
    </div></div>`,
    notes:'Escoger según el público. Para un público de negocio, quedarse con las dos primeras; para uno técnico, con transacciones y migración gradual.' }
]}
];

/* =========================================================
   Motor de navegación
   ========================================================= */
const flat = [];
MODULES.forEach((m, mi) => m.screens.forEach((s, si) => flat.push({mi, si})));
const planEnd = []; MODULES.reduce((acc,m,i)=> (planEnd[i] = acc + m.min), 0);
const revealed = new Set();
let idx = 0;

const $ = id => document.getElementById(id);
const screenEl = $('screen');

function parseHash(){
  const m = location.hash.match(/^#m(\d+)-s(\d+)$/);
  if (!m) return 0;
  const i = flat.findIndex(f => f.mi === +m[1] && f.si === +m[2] - 1);
  return i < 0 ? 0 : i;
}

function renderNav(){
  const cur = flat[idx].mi;
  let lastBlock = -1;
  $('navList').innerHTML = MODULES.map((m,i) => {
    const state = i < cur ? 'done' : i === cur ? 'current' : 'pending';
    const label = state==='done' ? 'completado' : state==='current' ? 'actual' : 'pendiente';
    const header = m.block !== lastBlock ? `<li class="blk">${BLOCKS[m.block]}</li>` : '';
    lastBlock = m.block;
    return `${header}<li><button data-mod="${i}" data-state="${state}" ${state==='current'?'aria-current="step"':''} aria-label="${BLOCKS[m.block]}, módulo ${i}: ${m.title}, ${label}">
      <span class="dot">${state==='done' ? '✓' : i}</span><span><span class="t">${m.title}</span><span class="m">${m.min ? m.min + ' min' : 'turno de preguntas'}, ${m.screens.length} pantallas</span></span></button></li>`;
  }).join('');
}

function render(animate=true){
  const {mi, si} = flat[idx];
  const mod = MODULES[mi], scr = mod.screens[si];
  screenEl.innerHTML = `
    <div class="modhead"><b>${BLOCKS[mod.block]}</b><span>Módulo ${mi}</span><span>${mod.min ? mod.min + ' min' : 'fuera del guion'}</span><span>Pantalla ${si+1} de ${mod.screens.length}</span>${scr.live ? `<span class="live">Código en vivo · ${scr.live}</span>` : ''}</div>
    <h2>${si===0 && mi!==0 ? mod.title : scr.title}</h2>
    ${si===0 && mi!==0 ? `<p class="goal">${mod.goal}</p><h3 style="margin-top:0">${scr.title}</h3>` : ''}
    ${scr.body()}`;
  if (mi===0 && si===0) screenEl.querySelector('.modhead + h2').remove();
  screenEl.querySelectorAll('[data-check]').forEach(c => { if (revealed.has(idx)) c.classList.add('revealed'); });
  if (animate){ screenEl.classList.remove('enter'); void screenEl.offsetWidth; screenEl.classList.add('enter'); }
  $('stage').scrollTop = 0;

  const pct = Math.round((idx+1)/flat.length*100);
  $('bar').firstElementChild.style.width = pct + '%';
  $('bar').setAttribute('aria-valuenow', pct);
  $('progressText').textContent = `Pantalla ${idx+1} de ${flat.length}`;
  $('screenPos').textContent = `${BLOCKS[mod.block]} · ${mod.title}`;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === flat.length - 1;
  $('next').textContent = idx === flat.length - 1 ? 'Fin del recorrido' : 'Continuar';
  const hasCheck = !!screenEl.querySelector('[data-check]');
  $('reveal').disabled = !hasCheck || revealed.has(idx);
  $('notes').innerHTML = `<h4>Notas del ponente</h4><p>Plan acumulado al terminar este módulo: ${planEnd[mi]} min de 50.</p><p>${scr.notes || 'Sin notas para esta pantalla.'}</p>`;
  renderNav();
  history.replaceState(null, '', `#m${mi}-s${si+1}`);
  updateTimer();
}

const go = i => { if (i>=0 && i<flat.length && i!==idx){ idx=i; render(); } };
function reveal(){
  const c = screenEl.querySelector('[data-check]');
  if (!c) return;
  c.classList.add('revealed'); revealed.add(idx); $('reveal').disabled = true;
}

/* Cronómetro de ensayo: compara con el plan acumulado del módulo actual */
let t0 = null, acc = 0, tick = null;
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function elapsed(){ return acc + (t0 ? (Date.now()-t0)/1000 : 0); }
function updateTimer(){
  const b = $('timer');
  if (!t0 && acc === 0){ b.textContent = 'Iniciar cronómetro'; b.classList.remove('late'); return; }
  const e = elapsed(), plan = planEnd[flat[idx].mi];
  b.textContent = `${fmt(e)} de ${plan} min${t0 ? '' : ' (pausa)'}`;
  b.classList.toggle('late', e/60 > plan);
}
function toggleTimer(){
  if (t0){ acc = elapsed(); t0 = null; clearInterval(tick); }
  else { t0 = Date.now(); tick = setInterval(updateTimer, 1000); }
  updateTimer();
}

/* Tema: oscuro por defecto (identidad del cartel); el claro se recuerda en este navegador */
let theme = 'dark';
try { theme = localStorage.getItem('charla-theme') === 'light' ? 'light' : 'dark'; } catch(e){}
function applyTheme(){
  if (theme === 'light') document.documentElement.dataset.theme = 'light';
  else delete document.documentElement.dataset.theme;
  $('themeBtn').textContent = theme === 'light' ? 'Modo oscuro' : 'Modo claro';
}
function toggleTheme(){
  theme = theme === 'light' ? 'dark' : 'light';
  applyTheme();
  try { localStorage.setItem('charla-theme', theme); } catch(e){}
}

function togglePresent(){
  const on = document.body.classList.toggle('presenting');
  $('presentBtn').textContent = on ? 'Salir de presentación' : 'Presentar';
  try {
    if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
    if (!on && document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  } catch(e){}
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('presenting')) togglePresent();
});

$('prev').onclick = () => go(idx-1);
$('next').onclick = () => go(idx+1);
$('reveal').onclick = reveal;
$('timer').onclick = toggleTimer;
$('notesBtn').onclick = () => $('notes').classList.toggle('open');
$('themeBtn').onclick = toggleTheme;
$('presentBtn').onclick = togglePresent;
$('navList').onclick = e => {
  const b = e.target.closest('[data-mod]'); if (!b) return;
  go(flat.findIndex(f => f.mi === +b.dataset.mod));
};
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  switch (e.key){
    case 'ArrowRight': case 'PageDown': e.preventDefault(); go(idx+1); break;
    case 'ArrowLeft':  case 'PageUp':   e.preventDefault(); go(idx-1); break;
    case 'Home': go(0); break;
    case 'End':  go(flat.length-1); break;
    case 's': case 'S': reveal(); break;
    case 'n': case 'N': $('notes').classList.toggle('open'); break;
    case 'p': case 'P': togglePresent(); break;
    case 't': case 'T': toggleTimer(); break;
    case 'c': case 'C': toggleTheme(); break;
    case 'Escape': $('notes').classList.remove('open'); break;
  }
});
window.addEventListener('hashchange', () => { const i = parseHash(); if (i !== idx){ idx = i; render(); } });

applyTheme();
idx = parseHash();
render(false);
</script>
</body>
</html>
